<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found | Mageworks.ai</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/assets/fonts/fonts.css">
<style>
  :root { --ink: #2d2533; --ink-2: #5d5266; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { display: grid; place-items: center; text-align: center; padding: 24px; color: var(--ink); font: 17px/1.6 "Inter", system-ui, sans-serif; overflow: hidden;
    background: linear-gradient(180deg, #f7d3b2, #f0a9a0 55%, #c9bddb); }
  #sky { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  main { position: relative; display: flex; flex-direction: column; align-items: center; }
  svg { width: 72px; height: 28px; margin-bottom: 28px; }
  h1 { font: 400 clamp(36px, 6vw, 60px)/1.05 "Fraunces", Georgia, serif; margin: 0 0 14px; letter-spacing: -0.015em; }
  p { color: var(--ink-2); margin: 0 auto 28px; max-width: 34ch; }
  a.btn { display: inline-block; background: var(--ink); color: #fbf6ef; text-decoration: none; padding: 13px 24px; border-radius: 999px; font-weight: 500; }
  a.btn:focus-visible { outline: 3px solid #fbf6ef; outline-offset: 3px; }
</style>
</head>
<body>
  <canvas id="sky" aria-hidden="true"></canvas>
  <main id="copy">
    <svg viewBox="-3 -3 110 46" aria-hidden="true"><g fill="none" stroke="#2d2533" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"><path d="M2 38 L13 4 L24 26 L35 4 L46 38"/><path d="M58 2 L69 36 L80 14 L91 36 L102 2"/></g></svg>
    <h1>Lost in the clouds.</h1>
    <p>This page doesn't exist, or it has moved. Let's get you back on solid ground.</p>
    <a class="btn" href="/">Back to mageworks.ai</a>
  </main>
<script>
(() => {
  // Halftone clouds drifting past, same dot style as the homepage hero but with no mountain.
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const cv = document.getElementById('sky'), ctx = cv.getContext('2d'), copy = document.getElementById('copy');
  let W, H, S, cells = [], t = 0;

  const P = new Uint8Array(512); { const p = [...Array(256).keys()]; for (let i = 255; i > 0; i--) { const j = Math.floor((Math.sin(i * 91.7) * 43758.5453 % 1 + 1) % 1 * (i + 1)); [p[i], p[j]] = [p[j], p[i]]; } for (let i = 0; i < 512; i++) P[i] = p[i & 255]; }
  const fade = x => x * x * (3 - 2 * x);
  const hash = (x, y) => P[(P[x & 255] + y) & 255] / 255;
  function noise(x, y) { const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi; const a = hash(xi, yi), b = hash(xi + 1, yi), c = hash(xi, yi + 1), d = hash(xi + 1, yi + 1); const u = fade(xf), v = fade(yf); return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v; }
  const fbm = (x, y) => noise(x, y) * .55 + noise(x * 2.1, y * 2.1) * .3 + noise(x * 4.3, y * 4.3) * .15;

  function build() {
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    W = innerWidth; H = innerHeight; S = W < 640 ? 8 : 10;
    cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    // keep a clear patch behind the text so it always reads
    const r = copy.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2;
    const rx = r.width / 2 + 60, ry = r.height / 2 + 50;
    cells = [];
    for (let y = S / 2; y < H; y += S) for (let x = S / 2; x < W; x += S) {
      const d = Math.hypot((x - cx) / rx, (y - cy) / ry);
      const clear = Math.max(0, Math.min(1, (1.25 - d) / 0.5));     // 1 behind the text, 0 well away from it
      const edge = y / H;                                             // clouds gather towards the bottom
      cells.push({ x, y, clear, bias: 0.34 * Math.max(0, edge - 0.55) / 0.45 + 0.08 * Math.max(0, 0.25 - edge) / 0.25 });
    }
    draw();
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    for (const c of cells) {
      // two layers drifting at different speeds give a sense of depth
      const n = fbm(c.x * 0.004 + t * 0.05, c.y * 0.008 + t * 0.008) * 0.65 + fbm(c.x * 0.007 - t * 0.03 + 40, c.y * 0.012) * 0.35;
      let k = (n - 0.42) * 2.4 + c.bias;
      k -= c.clear * 0.9;
      k = Math.max(0, Math.min(1, k));
      if (k > 0.15) {
        ctx.fillStyle = `rgba(251,246,239,${0.45 + k * 0.5})`;
        ctx.beginPath(); ctx.arc(c.x, c.y, S * (0.14 + 0.36 * k), 0, 7); ctx.fill();
      } else {
        ctx.fillStyle = 'rgba(255,255,255,0.3)'; ctx.beginPath(); ctx.arc(c.x, c.y, S * 0.09, 0, 7); ctx.fill();
      }
    }
  }

  // about 20 frames per second, and only while the tab is visible
  let last = 0, running = false;
  function loop(ts) {
    if (document.hidden) { running = false; return; }
    if (ts - last > 50) { t = ts / 1000; draw(); last = ts; }
    requestAnimationFrame(loop);
  }
  function start() { if (!reduce && !running && !document.hidden) { running = true; requestAnimationFrame(loop); } }
  document.addEventListener('visibilitychange', start);
  let rt; addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(build, 150); });
  (document.fonts ? document.fonts.ready : Promise.resolve()).then(() => { build(); start(); });
})();
</script>
</body>
</html>
